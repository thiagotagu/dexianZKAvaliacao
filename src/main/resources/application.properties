spring.application.name=educZK
server.port=8080
zk.homepage=index
zk.springboot-packaging=jar
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/educzk}
spring.datasource.username=${DATABASE_USERNAME:educzk}
spring.datasource.password=${DATABASE_PASSWORD:educzk}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
