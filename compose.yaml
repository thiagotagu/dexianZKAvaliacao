services:
  postgres:
    image: postgres:16-alpine
    container_name: educzk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educzk
      POSTGRES_USER: educzk
      POSTGRES_PASSWORD: educzk
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educzk -d educzk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educzk-app
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/educzk
      DATABASE_USERNAME: educzk
      DATABASE_PASSWORD: educzk
      TZ: America/Sao_Paulo
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
